name: Bug report
description: Report a reproducible defect in an accessible Pipesor repository.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities or share secrets here. Follow the [security reporting policy](https://github.com/pipesor-org/.github/blob/main/SECURITY.md)."
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What is happening?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser, OS, app version/commit, screenshots, logs without secrets.

name: Feature proposal
description: Propose a scoped capability or improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: Explain the user need, not just a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What observable result would satisfy the need?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and constraints
      description: Include known design, domain, permission, or backend dependencies.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
